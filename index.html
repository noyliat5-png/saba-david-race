<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>[hidden]{display:none!important}body{margin:0}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style></head><body><title>המירוץ של סבא דוד</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@700;900&family=IBM+Plex+Mono:wght@500;600&family=Rubik:wght@400;500;700&display=swap">
<style>
/* Layout: one-column phone app. Navy sticky bar, then cards that mirror the printed ones: red = task, gold = clue. */
:root{
  /* Invitation look: white paper, heavy black serif, blue + purple only, confetti, checkered race line. Single light theme on purpose. */
  --bg:#ffffff; --surface:#ffffff; --paper:#f7f8fc;
  --ink:#111111; --muted:#55596a; --line:#1a1a1a; --hair:#dfe2ec;
  --blue:#1e6fd0; --blue-soft:#eaf2fd; --red:#e53935; --red-soft:#fdecec; --gold:#b8860b; --gold-soft:#fff6d6;
  --task:var(--red); --task-soft:var(--red-soft); --clue:var(--blue); --clue-soft:var(--blue-soft);
  --accent:var(--blue);
  --good:#2e7d32; --good-soft:#e5f3e6; --bad:var(--red); --bad-soft:var(--red-soft);
  --bar:#111111; --bar-ink:#ffffff; --plate:#ffffff;
  --t0:#1e6fd0; --t1:#e53935; --t2:#2e7d32; --t3:#8e44ad;
  --display:"Frank Ruhl Libre","David Libre",Georgia,serif;
  --body:"Rubik","Heebo",Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:17px;line-height:1.6;direction:rtl;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bar)}
.wrap{max-width:600px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;line-height:1.2;text-wrap:balance}
h1{font-size:1.9rem} h2{font-size:1.4rem} h3{font-size:1.12rem}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.86rem}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bar);color:var(--bar-ink);
  margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));
  padding:10px max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;justify-content:space-between;gap:12px}
.bar .who{display:flex;align-items:center;gap:10px;min-width:0}
.bar .dot{width:14px;height:14px;border-radius:50%;flex:none;box-shadow:0 0 0 2px rgba(255,255,255,.7)}
.bar .name{font-family:var(--display);font-size:1.15rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.barbtn{background:transparent;border:1px solid rgba(255,255,255,.4);color:var(--bar-ink);border-radius:8px;padding:5px 12px;font-size:.88rem;min-height:36px}

.hero{display:flex;flex-direction:column;align-items:center;gap:10px;padding-top:18px;text-align:center}
.plate{background:var(--plate);border-radius:16px;padding:10px 14px;display:inline-flex}
.plate img{width:190px;height:auto;display:block}
.eyebrow{font-size:.8rem;letter-spacing:.06em;color:var(--muted);font-weight:600}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.btn{border:0;border-radius:10px;padding:12px 16px;font-weight:600;background:var(--ink);color:var(--bg);display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;text-decoration:none;text-align:center}
.btn.alt{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.btn.ghost{background:transparent;color:var(--muted);border:1px dashed var(--line);font-weight:500}
.btn.good{background:var(--good);color:var(--surface)}
.btn.bad{background:var(--bad);color:var(--surface)}
.btn[disabled]{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>.btn{flex:1 1 130px}
label{display:flex;flex-direction:column;gap:6px;font-weight:500}
input[type=text],input[type=number],input[inputmode],textarea,select{border:1.5px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;min-height:48px;width:100%}
textarea{min-height:110px;font-family:var(--mono);font-size:.8rem;direction:ltr;text-align:left}

/* race cards, echoing the printed ones */
.rc{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.rc .head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px;color:#fff}
.rc.task .head{background:var(--task)} .rc.clue .head{background:var(--clue)} .rc.finish .head{background:var(--ink);color:var(--bg)}
:root[data-theme="dark"] .rc .head{color:#0f1424}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .rc .head{color:#0f1424}}
.rc .kind{font-family:var(--display);font-size:1.15rem}
.rc .sub{font-size:.82rem;opacity:.92}
.rc .body{padding:16px;display:flex;flex-direction:column;gap:10px}
.rc .body p.open{font-weight:600}
.rc .foot{border-top:1px dashed var(--line);padding:8px 16px;font-size:.78rem;color:var(--muted);text-align:center}
.rc .foot b{color:var(--red)}
.poem{display:grid;gap:12px;background:var(--bg);border-radius:10px;padding:12px 14px}
.poem .st b{font-family:var(--display);font-weight:400;display:block;margin-bottom:2px}
.poem .miss{background:var(--gold-soft);border-radius:4px;padding:0 4px;font-weight:600}
.poem .note{color:var(--red);font-size:.86rem;font-weight:600;margin-inline-start:6px}
.qr{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.qr img{width:96px;height:96px;background:#fff;border-radius:8px;padding:4px;flex:none}
.qr .t{flex:1 1 160px;min-width:0;display:flex;flex-direction:column;gap:8px}

details.fold{background:var(--surface);border:1px solid var(--line);border-radius:14px}
details.fold>summary{list-style:none;padding:14px 16px;font-family:var(--display);font-size:1.12rem;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::after{content:"+";font-family:var(--mono);color:var(--muted)}
details.fold[open]>summary::after{content:"−"}
details.fold>.in{padding:0 16px 16px;display:flex;flex-direction:column;gap:10px}
.rules{width:100%;border-collapse:collapse;font-size:.93rem}
.rules td{border-top:1px solid var(--line);padding:8px 4px;vertical-align:top}
.rules td:last-child{white-space:nowrap;font-weight:600;padding-inline-start:10px}
.tablewrap{overflow-x:auto}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:20;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:600;max-width:calc(100% - 32px);box-shadow:0 6px 20px rgba(0,0,0,.25)}
.warn{background:var(--gold-soft);border:2px solid #f5b800;border-radius:12px;padding:10px 14px;font-size:.9rem}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.shake{animation:shake .25s 2}
@media (prefers-reduced-motion: reduce){.shake{animation:none}}
.mark{display:flex;flex-direction:column;align-items:center;gap:2px}
.mark .eighty{font-family:var(--display);font-size:3.4rem;line-height:1;color:var(--task);letter-spacing:.02em}
.mark .eighty span{color:var(--clue)}
.mark .tribe{font-family:var(--display);font-size:.95rem;color:var(--muted);direction:ltr}
.live{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;opacity:.85}
.live i{width:8px;height:8px;border-radius:50%;background:var(--accent);display:inline-block}
.live.off i{background:transparent;border:1.5px solid currentColor}

l%3D%22%231e88e5%22/%3E%3Crect%20x%3D%22327%22%20y%3D%22137%22%20width%3D%2212%22%20height%3D%224%22%20rx%3D%221%22%20fill%3D%22%23fbc02d%22%20transform%3D%22rotate%2876%20327%20137%29%22/%3E%3Ccircle%20cx%3D%22337%22%20cy%3D%22395%22%20r%3D%223%22%20fill%3D%22%23ff7043%22/%3E%3Cpath%20d%3D%22M236%20382%20q4%20-6%208%200%20t8%200%20t8%200%22%20fill%3D%22none%22%20stroke%3D%22%23ff7043%22%20stroke-width%3D%222.2%22%20stroke-linecap%3D%22round%22/%3E%3Ccircle%20cx%3D%22147%22%20cy%3D%22404%22%20r%3D%223%22%20fill%3D%22%238e44ad%22/%3E%3Crect%20x%3D%22354%22%20y%3D%22347%22%20width%3D%2212%22%20height%3D%224%22%20rx%3D%221%22%20fill%3D%22%2343a047%22%20transform%3D%22rotate%28156%20354%20347%29%22/%3E%3Ccircle%20cx%3D%22196%22%20cy%3D%2259%22%20r%3D%223%22%20fill%3D%22%23fbc02d%22/%3E%3Crect%20x%3D%22171%22%20y%3D%22308%22%20width%3D%2212%22%20height%3D%224%22%20rx%3D%221%22%20fill%3D%22%2343a047%22%20transform%3D%22rotate%2867%20171%20308%29%22/%3E%3Crect%20x%3D%2267%22%20y%3D%22370%22%20width%3D%2212%22%20height%3D%224%22%20rx%3D%221%22%20fill%3D%22%23e53935%22%20transform%3D%22rotate%2837%2067%20370%29%22/%3E%3C/svg%3E");background-size:420px auto;background-repeat:repeat;background-attachment:fixed}
h1,h2,h3,.rc .kind,.bar .name{font-weight:900}
h1{font-size:2.3rem}
.card,.rc,details.fold,.lock,.counter,.act,.tm,.board li,.mini li,.hint,.hostnote{border:2.5px solid var(--line)!important;border-radius:16px}
.mini li{border-inline-start-width:8px!important;border-inline-start-color:var(--c)!important}
.board li{border-inline-start-width:10px!important;border-inline-start-color:var(--c)!important}
.tm{border-top-width:2.5px!important}
.rc .head{color:#fff!important;border-bottom:2.5px solid var(--line)}
.rc .kind{font-size:1.3rem}
.rc .sub{background:rgba(255,255,255,.2);border-radius:999px;padding:2px 10px}
.rc .foot{border-top:0;background:repeating-conic-gradient(var(--ink) 0 25%,#fff 0 50%) 0 0/10px 10px;height:10px;padding:0;font-size:0;margin:0 16px 12px}
.btn{border-radius:999px;font-weight:700}
.btn.alt{border-width:2.5px}
.plate{border-radius:20px;padding:6px 10px}
.plate img{width:260px}
.hero h1{margin-top:-4px}
.hero .flag{width:min(320px,80%);height:12px;background:repeating-conic-gradient(var(--ink) 0 25%,#fff 0 50%) 0 0/12px 12px;margin-top:4px}
.pill-blue{display:inline-block;background:var(--blue);color:#fff;border-radius:999px;padding:2px 12px;font-weight:700;font-size:.85rem}
.tabs{border:2.5px solid var(--line);border-radius:999px;padding:4px}
.tabs button{border-radius:999px}
.seg button{border:2.5px solid var(--line);border-radius:999px}
.version{font-family:var(--mono);font-size:.75rem;color:var(--muted);text-align:center}
.news{position:fixed;inset:0;z-index:30;background:rgba(17,17,17,.55);display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-left,0px))}
.news .box{background:var(--surface);border:2.5px solid var(--line);border-radius:20px;max-width:440px;width:100%;padding:20px;display:flex;flex-direction:column;gap:12px;max-height:85vh;overflow:auto}
.news ul{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:6px}
.news img{width:160px;align-self:center}

.pick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pick button{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);text-align:start;min-height:84px}
.pick button .sw{width:26px;height:26px;border-radius:50%}
.pick button b{font-family:var(--display);font-weight:400;font-size:1.2rem}
.pick button[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 2px var(--ink) inset}
.lock{border:2px dashed var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;background:var(--surface)}
.lock .lk{display:flex;align-items:center;gap:10px}
.lock .lk .tag{font-family:var(--display);font-size:1.15rem}
.lock .lk .pill{font-size:.78rem;padding:2px 10px;border-radius:999px;font-weight:600}
.lock.task .pill{background:var(--task-soft);color:var(--task)} .lock.clue .pill{background:var(--clue-soft);color:var(--clue)} .lock.finish .pill{background:var(--bg);color:var(--ink)}
.codein{display:flex;gap:8px}
.codein input{font-family:var(--mono);font-size:1.5rem;letter-spacing:.3em;text-align:center;direction:ltr;flex:1;min-width:0}
.codein .btn{flex:none}
.err{color:var(--bad);font-weight:600;font-size:.92rem}
.ahead{display:flex;flex-wrap:wrap;gap:6px}
.ahead span{font-size:.82rem;border:1px solid var(--line);border-radius:999px;padding:2px 10px;color:var(--muted)}
.sect{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-top:6px}
.confirm{display:flex;flex-direction:column;gap:10px}

.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 56px);z-index:4}
.tabs button{border:0;background:transparent;border-radius:9px;padding:8px 2px;font-size:.88rem;font-weight:600;color:var(--muted);min-height:42px}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1 1 0;min-width:52px;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 6px;font-weight:600;min-height:44px}
.seg button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.teams{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tm{position:relative;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 12px 10px;text-align:start;display:flex;flex-direction:column;gap:2px;overflow:hidden;min-width:0}
.tm::before{content:"";position:absolute;inset:0 0 auto 0;height:5px;background:var(--c)}
.tm .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tm .bal{font-family:var(--mono);font-size:1.45rem;font-weight:600;font-variant-numeric:tabular-nums}
.tm[aria-pressed="true"]{border-color:var(--c);box-shadow:0 0 0 2px var(--c) inset}
.grp{display:flex;flex-direction:column;gap:8px}
.grp h3 .muted{font-family:var(--body);font-size:.85rem}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.act{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:10px;text-align:start;display:flex;flex-direction:column;gap:2px;min-height:62px}
.act .amt{font-family:var(--mono);font-weight:600;font-size:1.05rem}
.act.plus .amt{color:var(--good)} .act.minus .amt{color:var(--bad)}
.act .lb{font-size:.86rem;line-height:1.35}
.act:active{transform:scale(.98)}
.counter{border:1.5px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--surface)}
.counter .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.counter .ctl{display:flex;align-items:center;gap:8px}
.counter .ctl button.sq{width:48px;height:48px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-size:1.4rem;font-weight:600}
.counter .ctl .n{font-family:var(--mono);font-size:1.6rem;font-weight:600;min-width:2.2ch;text-align:center}
.counter .ctl .btn{flex:1}
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.log li{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.log .dot{width:10px;height:10px;border-radius:50%}
.log .what{min-width:0;font-size:.92rem;line-height:1.35}
.log .what small{display:block;color:var(--muted);font-size:.78rem}
.log .amt{font-family:var(--mono);font-weight:600;white-space:nowrap}
.log .amt.plus{color:var(--good)} .log .amt.minus{color:var(--bad)}
.undo{border:1px solid var(--line);background:transparent;border-radius:8px;padding:2px 8px;font-size:.78rem;color:var(--muted);margin-top:4px}
.undo.armed{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.hostnote{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;font-size:.95rem}
.hostnote b{font-weight:700}
.answer{background:var(--good-soft);border-radius:12px;padding:12px 14px;font-weight:600}
.hint{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.hint .c{font-family:var(--mono);font-weight:600;color:var(--clue)}
.codecard{display:flex;flex-direction:column;gap:10px;border-top:5px solid var(--c)}
.codecard .big{font-family:var(--mono);font-size:3rem;font-weight:600;letter-spacing:.18em;text-align:center;direction:ltr;line-height:1.1;padding:6px 0}
.codecard .meta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:.9rem}
.codes{border-collapse:collapse;font-size:.85rem;width:100%}
.codes th,.codes td{border-top:1px solid var(--line);padding:6px 6px;text-align:center;white-space:nowrap}
.codes td.mono{font-size:.95rem}
.codes td.done{color:var(--muted);text-decoration:line-through}
.board{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.board li{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;border-inline-start:8px solid var(--c)}
.board .rk{font-family:var(--display);font-size:1.6rem;text-align:center}
.board .nm{font-family:var(--display);font-size:1.25rem;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.board .bal{font-family:var(--mono);font-size:1.6rem;font-weight:600}
.board li.first{background:var(--clue-soft)}
.secthead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}

.mybal{display:flex;flex-direction:column;align-items:flex-end;line-height:1.1}
.mybal b{font-family:var(--mono);font-size:1.3rem;font-weight:600}
.mini{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mini li{display:flex;justify-content:space-between;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;border-inline-start:6px solid var(--c);min-width:0}
.mini li span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.mini li b{font-family:var(--mono)}
.mini li.me{box-shadow:0 0 0 2px var(--c) inset}
.hostbody.locked .act,.hostbody.locked .counter,.hostbody.locked #custom,.hostbody.locked [data-give],.hostbody.locked [data-back],.hostbody.locked [data-undo],.hostbody.locked #reset,.hostbody.locked [data-name]{opacity:.45;pointer-events:none}
.statusline{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap;font-size:.86rem;color:var(--muted)}
</style>

<div id="app" class="wrap" aria-live="polite"></div>
<div id="toast" class="toast" hidden></div>

function fnv(str){let h=0x811c9dc5;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,0x01000193)>>>0;}return h.toString(16).padStart(8,"0");}
function store(key){

  try{const k="__t";localStorage.setItem(k,"1");localStorage.removeItem(k);}catch(e){ok=false;}

function keepUI(app, fn){
  const vals={}, opens={}; const f=document.activeElement; const fid=f&&f.id; let sel=null;
  app.querySelectorAll("input[id],textarea[id]").forEach(e=>vals[e.id]=e.value);
  app.querySelectorAll("details[id]").forEach(d=>opens[d.id]=d.open);
  try{ if(fid&&f.selectionStart!=null) sel=[f.selectionStart,f.selectionEnd]; }catch(e){}
  fn();
  Object.entries(vals).forEach(([id,v])=>{const e=document.getElementById(id); if(e&&e.type!=="hidden") e.value=v;});
  Object.entries(opens).forEach(([id,o])=>{const d=document.getElementById(id); if(d) d.open=o;});
  if(fid){const e=document.getElementById(fid); if(e){e.focus({preventScroll:true}); try{ if(sel) e.setSelectionRange(sel[0],sel[1]); }catch(x){}}}
}

function txAll(){

/* ---------- writes: queued on the phone, sent in order, retried when the signal returns ---------- */
function enqueue(op){ if(bankLocked()){ toast("צפייה בלבד: אין לחשבון הזה הרשאת עריכה"); return; } L.outbox.push(op); saveL(); render(); flush(); }

function delTx(id){

  if(i>=0){ L.outbox.splice(i,1); saveL(); render(); } else enqueue({op:"del", id});

function setTeam(t, patch){

}
async function flush(){
  if(!db||flushing||writeDenied) return;
  flushing=true;
  try{
    while(L.outbox.length){
      const o=L.outbox[0];
      try{
        if(o.op==="add") await db.collection("tx").doc(o.id).set(o.data);
        else if(o.op==="del") await db.doc("tx/"+o.id).delete();
        else if(o.op==="team") await db.doc("teams/t"+o.t).set(o.data);
        L.outbox.shift(); saveL();
      }catch(e){
        const c=e&&e.code;
        if(c==="invalid_argument"||c==="not_granted"||c==="revoked"){ writeDenied=true; break; }
        if(c==="quota_exceeded"){ toast("מסד הנתונים מלא. אי אפשר לרשום עוד."); break; }
        clearTimeout(retryTimer); retryTimer=setTimeout(flush, 12000); break;
      }
    }
  } finally { flushing=false; render(); }
}

/* ---------- reads: live subscriptions, once ---------- */
function subscribe(){
  const timer=setTimeout(()=>{ if(!srv.live){ srv.stale=true; render(); } }, 10000);
  const ok=snap=>{ if(!snap.metadata.fromCache){ srv.live=true; srv.stale=false; clearTimeout(timer);} };
  db.collection("tx").onSnapshot(snap=>{
    srv.tx=Object.fromEntries(snap.docs.map(d=>[d.id,d.data()])); ok(snap); L.cacheTx=srv.tx; saveL(); render();
  }, ()=>{ srv.err=true; srv.live=false; clearTimeout(timer); render(); });
  db.collection("teams").onSnapshot(snap=>{
    srv.teams=Object.fromEntries(snap.docs.map(d=>[d.id,d.data()])); ok(snap); L.cacheTeams=srv.teams; saveL(); render();
  }, ()=>{ srv.err=true; srv.live=false; clearTimeout(timer); render(); });
}
/* ---------- standalone website: Firebase Realtime Database over its REST + streaming API ---------- */
const FB_URL = "https://saba-race-default-rtdb.europe-west1.firebasedatabase.app https://saba-race-default-rtdb.firebaseio.com https://saba-race-default-rtdb.asia-southeast1.firebasedatabase.app";
function fbDb(base){
  base=base.replace(/\/+$/,"")+"/race";
  const fail=()=>{ throw {code:"unavailable"}; };
  async function req(path, method, body){
    let r; try{ r=await fetch(`${base}/${path}.json`,{method, body:body===undefined?undefined:JSON.stringify(body)}); }catch(e){ fail(); }
    if(r.status===401||r.status===403) throw {code:"invalid_argument"};
    if(!r.ok) fail();
  }
  const docRef=p=>({set:d=>req(p,"PUT",d), delete:()=>req(p,"DELETE")});
  const coll=c=>({
    doc:id=>docRef(`${c}/${id}`),
    onSnapshot(next, err){
      let tree={}; const es=new EventSource(`${base}/${c}.json`);
      const emit=()=>next({docs:Object.entries(tree).filter(([,v])=>v&&typeof v==="object").map(([id,v])=>({id,exists:true,data:()=>v,metadata:{fromCache:false}})),metadata:{fromCache:false,hasPendingWrites:false}});
      const apply=(path,data,merge)=>{
        const parts=path.split("/").filter(Boolean);
        if(!parts.length){ tree = merge ? Object.assign({},tree,data||{}) : (data||{}); if(merge) for(const k in data) if(data[k]===null) delete tree[k]; return; }
        const id=parts[0];
        if(parts.length===1){ if(data===null) delete tree[id]; else tree[id]= merge ? Object.assign({},tree[id],data) : data; return; }
        const cur=Object.assign({},tree[id]||{}); cur[parts[1]]=data; tree[id]=cur;
      };
      es.addEventListener("put",e=>{const m=JSON.parse(e.data);apply(m.path,m.data,false);emit();});
      es.addEventListener("patch",e=>{const m=JSON.parse(e.data);apply(m.path,m.data,true);emit();});
      es.addEventListener("cancel",()=>{err&&err({code:"invalid_argument"});});
      es.onerror=()=>{err&&err({code:"unavailable"});};
      return ()=>es.close();
    }});
  return {collection:coll, doc:p=>docRef(p)};
}

  h+=`<div class="card" id="ctrlbar"><div class="secthead"><h3>שלב ${u+1} מתוך ${steps.length}</h3><span class="muted small">${u<0?"עוד לא נפתחה כרטיסייה":esc(steps[u].label)}</span></div>
    <div class="row"><button class="btn alt" id="cprev"${u<0?" disabled":""}>הקודם</button><button class="btn" id="cnext"${u>=steps.length-1?" disabled":""}>הבא</button></div>
    <div class="seg">${steps.map((s,i)=>`<button data-cjump="${i}" aria-pressed="${i===u}" title="${esc(s.label)}">${i+1}</button>`).join("")}</div>
    <div class="row"><button class="btn ghost" id="call">פתיחת הכול</button><button class="btn ghost" id="cnews">הצגת הודעת שדרוג</button></div></div>`;
  h+=heroHTML("המירוץ של סבא דוד","✦ מירוץ משפחתי לכבוד יום הולדת 80 ✦");
  if(db||localTest){ const order=[0,1,2,3].map(x=>({x,b:balOf(x,txs)})).sort((a,b)=>b.b-a.b);
    h+=`<ul class="mini" aria-label="היתרות של כל הקבוצות">${order.map(o=>`<li style="--c:${TEAM_VAR(o.x)}"><span>${esc(tname(o.x))}</span><b>${shekel(o.b)}</b></li>`).join("")}</ul>`; }
  h+=briefingHTML(u<0);
  h+=`<div class="sect"><h2>הכרטיסיות שלכם</h2><span class="muted small mono">${Math.max(0,u+1)}/${steps.length}</span></div>`;
  for(let i=0;i<=u;i++) h+=stepCardHTML(steps[i],"בקרה");
  if(next){
    h+=`<div class="lock ${next.kind}"><div class="lk"><span class="tag">${esc(next.label)}</span><span class="pill">נעול</span></div>
      <p class="muted">כך נראית כרטיסייה נעולה אצל הקבוצות. לחצו ״הבא״ כדי לפתוח אותה.</p></div>`;
    const rest=steps.slice(u+2); if(rest.length) h+=`<div class="ahead">${rest.map(s=>`<span>${esc(s.label)}</span>`).join("")}</div>`;
  }
  return h;
}
function bindControl(){
  const go=i=>{L.ctrlStep=i;saveL();render();const id=i>=0?"card-"+DATA.steps[i].id:"ctrlbar";const el=document.getElementById(id);if(el)el.scrollIntoView({behavior:"smooth",block:"start"});};
  $("#ctrlexit").onclick=()=>{L.control=false;saveL();render();scrollTo(0,0);};
  $("#cprev").onclick=()=>go(L.ctrlStep-1);
  $("#cnext").onclick=()=>go(L.ctrlStep+1);
  $("#call").onclick=()=>{L.ctrlStep=DATA.steps.length-1;saveL();render();};
  $("#cnews").onclick=()=>{ui.news=true;ui.prevVer=null;render();};
  document.querySelectorAll("[data-cjump]").forEach(b=>b.onclick=()=>go(+b.dataset.cjump));
}

/* =================== HOST VIEW =================== */
const GENERAL = [
  {amt:100, lb:"ראשונים ללחוש את הפתרון הנכון לרמז"},
  {amt:-30, lb:"רמז ראשון בתשלום"},
  {amt:-60, lb:"רמז שני בתשלום"},
  {amt:-10, lb:"תשובה שגויה למנחה"},

  {amt:-100,lb:"קנס רמאות"},
];
const STATION_ACTS = {

     {counter:"absent", per:-20, lb:"חברי קבוצה שלא השתתפו בדקלום", unit:"חברים", note:"20 ₪ לכל חבר"}],
  3:[{amt:50, lb:"שלב א׳: המשפט הגיע לאחרון בלי שינוי"},
     {amt:50, lb:"שלב ב׳: זיהוי השיר"},
     {amt:50, lb:"שלב ג׳: תמונה מול הציור הנכון"}],
  4:[{counter:"hits", per:20, lb:"שלב א׳: כדורי טניס שפגעו", unit:"פגיעות", note:"20 ₪ לכל פגיעה, בשני הניסיונות יחד"},
     {counter:"sites", per:10, lb:"שלב ב׳: אתרים שזוהו במפה האילמת", unit:"אתרים", note:"10 ₪ לכל אתר"}],
};
function hostHTML(){
  let h=`<header class="bar"><div class="who"><span class="dot" style="background:var(--accent)"></span><span class="name">המירוץ · מנחים</span></div><div style="display:flex;align-items:center;gap:10px">${statusHTML()}<button class="barbtn" id="toteam">מסך משתתפים</button></div></header>`;
  if(bankLocked()) h+=`<div class="warn"><b>צפייה בלבד.</b> אפשר לראות את החוברת, את היתרות ואת הקודים ולתת לקבוצות קודים. רישום כסף ופתיחת כרטיסיות מהטלפון הזה ייפתחו רק אחרי שליאת תזמין את החשבון הזה במייל בתור Editor.</div>`;
  else if(writeDenied) h+=`<div class="warn">השינויים לא נשמרים בשרת כי לחשבון הזה אין הרשאת עריכה. בקשו מליאת לשתף אתכם כעורכים (Editor).</div>`;
  else if(!db) h+=`<div class="warn">אין סנכרון בתצוגה הזאת. הרישומים נשמרים בטלפון הזה ויישלחו כשהדף ייפתח עם חיבור לחשבון.</div>`;
  else if((srv.stale||srv.err) && !srv.live) h+=`<div class="warn">אין קליטה כרגע. אפשר להמשיך לרשום: הרישומים נשמרים בטלפון ויישלחו לבד כשהקליטה תחזור. הקבוצות יכולות לפתוח כרטיסיות עם הקודים.</div>`;
  const tabs=[["bank","בנק"],["guide","חוברת"],["codes","פתיחה"],["board","טבלה"],["set","הגדרות"]];
  h+=`<nav class="tabs" role="tablist">${tabs.map(([k,l])=>`<button role="tab" data-tab="${k}" aria-selected="${L.tab===k}">${l}</button>`).join("")}</nav>`;
  const txs=txAll();
  h+= `<div class="hostbody${bankLocked()?" locked":""}">`;
  h+= L.tab==="bank"?bankHTML(txs): L.tab==="guide"?guideHTML(): L.tab==="codes"?codesHTML(): L.tab==="board"?boardHTML(txs): setHTML();
  h+=`</div>`;
  return h;
}
function actBtn(a,i,grp){ return `<button class="act ${a.amt>0?"plus":"minus"}" data-act="${grp}:${i}"><span class="amt">${signed(a.amt)}</span><span class="lb">${esc(a.lb)}</span></button>`; }
function counterHTML(a,i){
  const n=ui.counts[a.counter]||0;
  return `<div class="counter"><div class="top"><b>${esc(a.lb)}</b><span class="muted small">${esc(a.note)}</span></div>
    <div class="ctl"><button class="sq" data-cnt="${a.counter}" data-d="1" aria-label="עוד אחד">+</button><span class="n">${n}</span><button class="sq" data-cnt="${a.counter}" data-d="-1" aria-label="אחד פחות">−</button>
    <button class="btn ${a.per>0?"good":"bad"}" data-cact="${i}"${n===0?" disabled":""}>רישום ${signed(n*a.per)}</button></div></div>`;
}
function bankHTML(txs){
  const t=L.sel, sacts=STATION_ACTS[L.station];
  const list=(ui.logAll?txs:txs.filter(x=>x.team===t)).slice().reverse();
  const pendIds=new Set(L.outbox.filter(o=>o.op==="add").map(o=>o.id));
  return `<div class="teams">${[0,1,2,3].map(x=>`<button class="tm" data-sel="${x}" aria-pressed="${t===x}" style="--c:${TEAM_VAR(x)}"><span class="nm">${esc(tname(x))}</span><span class="bal">${shekel(balOf(x,txs))}</span></button>`).join("")}</div>
  <div class="card"><div class="secthead"><h2 style="color:${TEAM_VAR(t)}">${esc(tname(t))}</h2><span class="muted small">יתרה <b class="mono">${shekel(balOf(t,txs))}</b></span></div>
   <div class="grp"><h3>תחנה</h3><div class="seg">${[1,2,3,4].map(n=>`<button data-st="${n}" aria-pressed="${L.station===n}">${n}</button>`).join("")}</div>
    <p class="muted small">${esc(DATA.stations[L.station-1].name)}</p></div>
   <div class="grp"><h3>ניקוד המשימה</h3>
    ${sacts.some(a=>!a.counter)?`<div class="acts">${sacts.map((a,i)=>a.counter?"":actBtn(a,i,"s")).join("")}</div>`:""}
    ${sacts.map((a,i)=>a.counter?counterHTML(a,i):"").join("")}</div>
   <div class="grp"><h3>חוקי המירוץ <span class="muted">בכל תחנה</span></h3><div class="acts">${GENERAL.map((a,i)=>actBtn(a,i,"g")).join("")}</div></div>
   <div class="grp"><h3>סכום אחר</h3><p class="muted small">למשל ציון חלקי של סבא בדקלום.</p>
    <form id="custom" class="grp" autocomplete="off">
     <div class="row"><input id="camt" inputmode="numeric" pattern="[0-9]*" placeholder="סכום ב־₪" aria-label="סכום" style="flex:1 1 120px">
      <input id="clb" type="text" placeholder="סיבה" aria-label="סיבה" style="flex:2 1 160px"></div>
     <div class="row"><button class="btn good" type="submit" data-sign="1">הוספה</button><button class="btn bad" type="submit" data-sign="-1">הורדה</button></div></form></div>
  </div>
  <div class="card"><div class="secthead"><h3>${ui.logAll?"כל הרישומים":"רישומים של "+esc(tname(t))}</h3><button class="undo" id="logall">${ui.logAll?"רק הקבוצה הזאת":"כל הקבוצות"}</button></div>
   ${list.length?`<ul class="log">${list.map(x=>`<li><span class="dot" style="background:${TEAM_VAR(x.team)}"></span><span class="what">${esc(x.label)}<small>${esc(tname(x.team))} · תחנה ${x.station} · ${new Date(x.t).toLocaleTimeString("he-IL",{hour:"2-digit",minute:"2-digit"})}${pendIds.has(x.id)?" · ממתין לקליטה":""}</small></span>
     <span style="text-align:end"><span class="amt ${x.amount>0?"plus":"minus"}">${signed(x.amount)}</span><br><button class="undo${ui.armed===x.id?" armed":""}" data-undo="${esc(x.id)}">${ui.armed===x.id?"לבטל? כן":"ביטול"}</button></span></li>`).join("")}</ul>`
     :`<p class="muted">עדיין אין רישומים. כל קבוצה מתחילה עם ${START} ₪.</p>`}
  </div>`;
}
function guideHTML(){
  const g=L.guide;
  let h=`<div class="seg">${["פתיחה","1","2","3","4"].map((l,i)=>`<button data-guide="${i}" aria-pressed="${g===i}">${l}</button>`).join("")}</div>`;
  if(g===0) return h+`<div class="card"><h2>תדריך פתיחה</h2><p class="muted small">להקראה בקול</p>${DATA.briefing.map((l,i)=>`<p${i===0?' style="font-weight:600"':""}>${esc(l)}</p>`).join("")}</div>
      <div class="card"><h2>חוקי המירוץ</h2><div class="tablewrap"><table class="rules"><tbody>${DATA.rules.map(r=>`<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td></tr>`).join("")}</tbody></table></div>${DATA.rulesNotes.map(l=>`<p>${esc(l)}</p>`).join("")}</div>`;
  const s=DATA.stations[g-1], byId=id=>DATA.steps.find(x=>x.id===id);
  h+=`<div class="secthead"><h2>תחנה ${s.n} · ${esc(s.name)}</h2><span class="muted small">לא להראות למשתתפים</span></div>`;
  h+=stepCardHTML(byId(s.task));
  const nb=[]; if(s.equip) nb.push(["ציוד למנחה",s.equip]); s.notes.forEach(n=>nb.push(n));
  if(nb.length) h+=`<div class="hostnote">${nb.map(([k,v])=>`<p><b>${esc(k)}:</b> ${esc(v)}</p>`).join("")}</div>`;
  if(s.task2) h+=stepCardHTML(byId(s.task2));
  if(s.clue){
    h+=stepCardHTML(byId(s.clue))+`<div class="answer">התשובה: ${esc(s.answer)}</div>`;
    if(s.hints.length) h+=`<div class="grp"><h3>רמזים בתשלום</h3>${s.hints.map((x,i)=>`<div class="hint"><span class="c">${i===0?"רמז ראשון · 30 ש״ח":"רמז שני · 60 ש״ח"}</span><span>${esc(x)}</span></div>`).join("")}</div>`;
  } else h+=stepCardHTML(byId("end"));
  return h;
}
function codesHTML(){
  const steps=DATA.steps, tm=teamsAll();
  let h=`<p class="muted">״פתיחה לקבוצה״ מציג את הכרטיסייה הבאה בטלפון של הקבוצה. אם אין שם קליטה, תנו לקבוצה את הקוד.</p>`;
  h+=[0,1,2,3].map(t=>{
    const p=tm[t].progress, next=steps[p+1];
    return `<div class="card codecard" style="--c:${TEAM_VAR(t)}"><div class="meta"><b>${esc(tname(t))}</b><span class="muted">${p<0?"עוד לא נפתחה אף כרטיסייה":"פתוח עד: "+esc(steps[p].label)}</span></div>
      ${next?`<button class="btn good" data-give="${t}">פתיחה לקבוצה: ${esc(next.label)}</button>
        <div class="muted small" style="text-align:center">קוד ל־${esc(next.label)}, אם אין קליטה</div><div class="big">${DATA.codes[t][p+1]}</div>
        ${p>=0?`<button class="btn ghost" data-back="${t}">ביטול הפתיחה האחרונה</button>`:""}`
      :`<p class="answer" style="text-align:center">כל הכרטיסיות נפתחו</p><button class="btn ghost" data-back="${t}">ביטול הפתיחה האחרונה</button>`}</div>`;
  }).join("");
  h+=`<details class="fold" id="d-codes"><summary>כל הקודים</summary><div class="in"><div class="tablewrap"><table class="codes"><thead><tr><th></th>${[0,1,2,3].map(t=>`<th style="color:${TEAM_VAR(t)}">${esc(tname(t))}</th>`).join("")}</tr></thead><tbody>
    ${steps.map((s,i)=>`<tr><th style="text-align:start">${esc(s.label)}</th>${[0,1,2,3].map(t=>`<td class="mono${tm[t].progress>=i?" done":""}">${DATA.codes[t][i]}</td>`).join("")}</tr>`).join("")}</tbody></table></div>
    <p class="muted small">קוד של כרטיסייה מאוחרת פותח גם את כל מה שלפניה.</p></div></details>`;
  return h;
}
function boardHTML(txs){
  const order=[0,1,2,3].map(t=>({t,b:balOf(t,txs)})).sort((a,b)=>b.b-a.b);
  let rank=0,prev=null;
  const rows=order.map((o,i)=>{if(o.b!==prev){rank=i+1;prev=o.b;}return {...o,rank};});
  return `${heroHTML("טבלת המירוץ","")}<ol class="board">${rows.map(r=>`<li class="${r.rank===1?"first":""}" style="--c:${TEAM_VAR(r.t)}"><span class="rk">${r.rank}</span><span class="nm">${esc(tname(r.t))}</span><span class="bal">${shekel(r.b)}</span></li>`).join("")}</ol>
   <p class="muted small" style="text-align:center">כל קבוצה התחילה עם ${START} ₪ · ${txs.length} רישומים</p>`;
}
function setHTML(){
  return `<div class="card"><h2>שמות הקבוצות</h2><p class="muted small">השמות מופיעים גם בטלפונים של הקבוצות.</p>${[0,1,2,3].map(t=>`<label for="nm${t}"><span style="color:${TEAM_VAR(t)}">קבוצה ${t+1}</span><input id="nm${t}" type="text" maxlength="24" value="${esc(tname(t))}" data-name="${t}"></label>`).join("")}</div>
  <div class="card"><h2>קבוצת בקרה</h2><p class="muted">מעבר על כל הכרטיסיות, התמונות והעיצובים כמו שהקבוצות רואות, בלי לשנות כלום במירוץ.</p><button class="btn" id="toctrl">פתיחת קבוצת הבקרה</button></div>
  <div class="card"><h2>מה הקבוצות רואות</h2><p class="muted">תצוגה מקדימה של מסך הקבוצה, בלי לשנות כלום.</p><div class="row">${[0,1,2,3].map(t=>`<button class="btn alt" data-prev="${t}">${esc(tname(t))}</button>`).join("")}</div></div>
  <div class="card"><h2>איפוס המירוץ</h2><p class="muted">מוחק את כל הרישומים ומחזיר את כל הכרטיסיות למצב נעול, אצל כולם. שמות הקבוצות נשמרים.</p>
   ${ui.confirmReset?`<div class="row"><button class="btn bad" id="resetyes">כן, למחוק הכול</button><button class="btn alt" id="resetno">ביטול</button></div>`:`<button class="btn ghost" id="reset">איפוס</button>`}</div>`;
}
function bindHost(){
  const all=(s,f)=>document.querySelectorAll(s).forEach(f);
  const tt=$("#toteam"); if(tt) tt.onclick=()=>{L.mode="team";saveL();render();scrollTo(0,0);};
  all("[data-tab]",b=>b.onclick=()=>{L.tab=b.dataset.tab;saveL();render();scrollTo(0,0);});
  all("[data-sel]",b=>b.onclick=()=>{L.sel=+b.dataset.sel;ui.counts={};saveL();render();});
  all("[data-st]",b=>b.onclick=()=>{L.station=+b.dataset.st;ui.counts={};saveL();render();});
  all("[data-guide]",b=>b.onclick=()=>{L.guide=+b.dataset.guide;saveL();render();});
  all("[data-act]",b=>b.onclick=()=>{const [g,i]=b.dataset.act.split(":");const a=(g==="g"?GENERAL:STATION_ACTS[L.station])[+i];addTx(L.sel,a.amt,g==="g"?a.lb:`תחנה ${L.station} · ${a.lb}`);});
  all("[data-cnt]",b=>b.onclick=()=>{const k=b.dataset.cnt;ui.counts[k]=Math.max(0,Math.min(99,(ui.counts[k]||0)+(+b.dataset.d)));render();});
  all("[data-cact]",b=>b.onclick=()=>{const a=STATION_ACTS[L.station][+b.dataset.cact];const n=ui.counts[a.counter]||0;if(!n)return;ui.counts[a.counter]=0;addTx(L.sel,n*a.per,`תחנה ${L.station} · ${a.lb}: ${n} ${a.unit}`);});
  const cf=$("#custom"); if(cf) cf.onsubmit=e=>{e.preventDefault();const sign=+(e.submitter?.dataset.sign||1);const v=parseInt($("#camt").value,10);
    if(!v||v<=0){toast("הקלידו סכום חיובי");return;} const lb=$("#clb").value.trim()||"סכום אחר"; $("#camt").value="";$("#clb").value=""; addTx(L.sel,sign*v,`תחנה ${L.station} · ${lb}`);};
  all("[data-undo]",b=>b.onclick=()=>{const id=b.dataset.undo;
    if(ui.armed===id){ui.armed=null;clearTimeout(ui.armedTimer);delTx(id);return;}
    ui.armed=id;clearTimeout(ui.armedTimer);ui.armedTimer=setTimeout(()=>{ui.armed=null;render();},4000);render();});
  const la=$("#logall"); if(la) la.onclick=()=>{ui.logAll=!ui.logAll;render();};
  all("[data-give]",b=>b.onclick=()=>{const t=+b.dataset.give,p=teamsAll()[t].progress;if(p<DATA.steps.length-1){setTeam(t,{progress:p+1});toast(`${tname(t)}: ${DATA.steps[p+1].label} נפתחה`);}});
  all("[data-back]",b=>b.onclick=()=>{const t=+b.dataset.back,p=teamsAll()[t].progress;if(p>=0) setTeam(t,{progress:p-1});});
  all("[data-name]",inp=>inp.onchange=()=>{const t=+inp.dataset.name;const v=inp.value.trim()||`קבוצה ${t+1}`;if(v!==tname(t)) setTeam(t,{name:v});});
  const tc=$("#toctrl"); if(tc) tc.onclick=()=>{L.control=true;L.ctrlStep=0;saveL();render();scrollTo(0,0);};
  all("[data-prev]",b=>b.onclick=()=>{L.preview=+b.dataset.prev;saveL();render();scrollTo(0,0);});
  const rs=$("#reset"); if(rs) rs.onclick=()=>{ui.confirmReset=true;render();};
  const rn=$("#resetno"); if(rn) rn.onclick=()=>{ui.confirmReset=false;render();};
  const ry=$("#resetyes"); if(ry) ry.onclick=()=>{
    ui.confirmReset=false;
    const ids=txAll().map(x=>x.id);
    L.outbox=L.outbox.filter(o=>o.op!=="add");
    ids.filter(id=>srv.tx[id]).forEach(id=>L.outbox.push({op:"del",id}));
    [0,1,2,3].forEach(t=>{L.outbox=L.outbox.filter(o=>!(o.op==="team"&&o.t===t));L.outbox.push({op:"team",t,data:{name:tname(t),progress:-1}});});
    saveL(); render(); flush(); toast("המירוץ אופס");
  };
}
boot();
